.modal .panel { width: 100%; max-width: 560px; }
.title { text-align: center; padding: 6vh 0 4vh; }
.title h1 { font: clamp(3rem, 2rem + 6vw, 6rem)/1 var(--display); color: var(--lichen); margin: 0; }
.title p { color: var(--dim); max-width: 34em; margin: 14px auto; }

.fine { color: var(--dim); font-size: .78rem; margin-top: 28px; }
.fine a { color: var(--dim); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

y, even armor outside the guild's usual kit."}},"costs":{"fighter":{"lore":3,"perception":2,"disarm":3,"locks":3,"firstaid":2,"armor":1},"rogue":{"lore":2,"perception":1,"disarm":1,"locks":1,"firstaid":2,"armor":2},"wizard":{"lore":1,"perception":2,"disarm":3,"locks":3,"firstaid":2,"armor":4},"cleric":{"lore":2,"perception":2,"disarm":3,"locks":3,"firstaid":1,"armor":2}},"start":{"fighter":{"armor":4,"perception":1},"rogue":{"lore":2,"perception":2,"disarm":2,"locks":2,"armor":1},"wizard":{"lore":2},"cleric":{"firstaid":2,"armor":2}},"start_armor":{"fighter":"chain_shirt","rogue":"leather","cleric":"chain_shirt"},"points_per_level":6,"max_ranks":{"base":2,"per_level":2},"armor_need":{"leather":1,"studded":1,"chain_shirt":2,"scale":2,"chain_mail":4}}};

const R = n => Math.floor(Math.random() * n);

  const m = /^(\d+)d(\d+)([+-]\d+)?$/.exec(String(s));
  if (!m) return +s || 0;
  let t = +(m[3] || 0);
  const n = +m[1] * (crit ? 2 : 1);
  for (let i = 0; i < n; i++) t += 1 + R(+m[2]);
  return Math.max(1, t);

function ensureSkills(c) {
  if (c.sk) return;
  c.sk = {...(SK.start[c.guild] || {})};
  c.tp = (c.lvl - 1) * SK.points_per_level;
}
/* The living member best at a skill, or null if nobody has a rank in it. */
function best(k) { let b = null; for (const c of alive()) if (rank(c, k) > 0 && (!b || rank(c, k) + mod(c.st[SKILLS[k].stat]) > rank(b, k) + mod(b.st[SKILLS[k].stat]))) b = c; return b; }
const pct = n => Math.max(5, Math.min(95, n));
/* Attack penalty for armor heavier than the wearer has trained for. */
function armorPenalty(c) { const a = worn(c, 'armor'); return a ? 2 * Math.max(0, armorNeed(a.base) - rank(c, 'armor')) : 0; }

function makeChar(name, race, guild, st, gear) {
  const c = {id: uid(), name, race, guild, lvl: 1, xp: 0, st, inv: [], status: 'ok', where: 'town'};
  ensureSkills(c);
  c.mhp = Math.max(1, GUILDS[guild].hd + mod(st.con)); c.hp = c.mhp; c.msp = maxSp(c); c.sp = c.msp;
  for (const b of gear) { const k = ITEMS[b].kind; c.inv.push({base: b, plus: 0, cursed: false, id: 2, eq: ['weapon','armor','shield'].includes(k) && !worn(c, k)}); }
  return c;
}
const START_GEAR = {fighter:['longsword','chain_shirt','shield','potion_heal'], rogue:['shortsword','leather','dagger','potion_heal'], wizard:['quarterstaff','potion_heal'], cleric:['mace','chain_shirt','shield','potion_heal']};
const prof = c => 2 + Math.floor((c.lvl - 1) / 4);
const worn = (c, kind) => c.inv.find(i => i.eq && ITEMS[i.base].kind === kind);
function acOf(c) {
  const a = worn(c, 'armor'), s = worn(c, 'shield'), r = worn(c, 'ring'), dm = mod(c.st.dex);
  let ac = a ? ITEMS[a.base].ac + Math.min(dm, ITEMS[a.base].dex) + a.plus : 10 + dm;
  if (s) ac += 2 + s.plus;
  if (r) ac += r.plus;
  return ac;
}
function weaponOf(c) { const w = worn(c, 'weapon'); return w ? {it: w, b: ITEMS[w.base]} : null; }
function atkMod(c) { const w = weaponOf(c); const m = w && w.b.fin ? Math.max(mod(c.st.str), mod(c.st.dex)) : mod(c.st.str); return m; }
function spellsOf(c) { return Object.entries(SPELLS).filter(([, s]) => s.guild === c.guild && c.lvl >= s.lvl); }
function canUse(c, it) {
  const b = ITEMS[it.base], g = GUILDS[c.guild];
  if (b.kind === 'weapon') return g.weapons.includes(it.base);
  if (b.kind === 'armor') return g.armor.includes(it.base) || rank(c, 'armor') >= armorNeed(it.base);
  if (b.kind === 'shield') return !!g.shield;
  return b.kind === 'ring';
}
function itemName(it) {
  const b = ITEMS[it.base];
  let lv = it.id;
  if (['potion','scroll','ring'].includes(b.kind) && S.known[it.base]) lv = Math.max(lv, 1);
  if (lv === 0) return cap(b.cat);
  if (lv === 1 || b.kind === 'potion' || b.kind === 'scroll') return b.name;
  return b.name + (it.plus ? (it.plus > 0 ? ' +' : ' ') + it.plus : '') + (it.cursed ? ' (cursed)' : '');
}
/* What an item does, and how it would suit each living companion. Shown once
   its kind is known; a +bonus only counts once it is fully identified. */
function itemInfo(owner, it) {
  const b = ITEMS[it.base];
  let lv = it.id;
  if (['potion','scroll','ring'].includes(b.kind) && S.known[it.base]) lv = Math.max(lv, 1);
  if (lv === 0) return `<div class="iinfo"><span class="tag">Unknown</span> Anyone with Lore can study it, or the store can identify it.</div>`;
  const full = lv >= 2 || ['potion','scroll'].includes(b.kind);
  const tag = full ? '<span class="tag ok">Fully identified</span> ' : '<span class="tag">Partly known</span> ';
  const plus = lv >= 2 ? it.plus : 0, sp = plus ? (plus > 0 ? '+' : '') + plus : '';
  let what = '';
  if (b.kind === 'weapon') what = `Damage ${b.dmg}${sp}${b.fin ? ', finesse: uses STR or DEX, whichever is better' : ', uses STR'}.`;
  if (b.kind === 'armor') what = `Armor class ${b.ac + plus}${b.dex >= 9 ? ' + DEX' : b.dex ? ` + DEX (up to ${b.dex})` : ', no DEX bonus'}. Needs Armor use ${armorNeed(it.base)} to fight in it without an attack penalty.`;
  if (b.kind === 'shield') what = `Adds ${2 + plus} to armor class.`;
  if (b.kind === 'ring') what = lv >= 2 ? `Adds ${plus} to armor class.` : 'Identify it fully to learn its strength.';
  if (b.kind === 'potion') what = `Heals ${b.heal}.`;
  if (b.kind === 'scroll') what = 'Reveals one item completely.';
  if (!full) what += ' Its enchantment or curse is still hidden. Study it again on another trip, read a scroll, or pay the store.';
  what = tag + what;
  if (!['weapon','armor','shield','ring'].includes(b.kind)) return `<div class="iinfo">${what}</div>`;
  const folk = (ui.screen === 'town' ? townFolk() : party()).filter(o => o.status === 'ok');
  const fits = [], not = [];
  for (const o of folk) {
    if (!canUse(o, it)) { not.push(esc(o.name)); continue; }
    const trial = {...o, inv: o.inv.filter(x => !(x.eq && ITEMS[x.base].kind === b.kind)).concat([{...it, plus, eq: true}])};
    if (b.kind === 'weapon') {
      const w = weaponOf(o), m = atkMod(trial), now = w ? `${w.b.dmg}${fmt(atkMod(o) + (w.it.id >= 2 ? w.it.plus : 0))}` : 'bare hands';
      fits.push(`${esc(o.name)} ${b.dmg}${fmt(m + plus)} <span class="muted">(now ${now})</span>`);
    } else {
      const a0 = acOf(o), a1 = acOf(trial);
      const pen = b.kind === 'armor' ? armorPenalty(trial) : 0;
      fits.push(`${esc(o.name)} AC ${a0} &rarr; <b class="${a1 > a0 ? 'up' : a1 < a0 ? 'down' : ''}">${a1}</b>${pen ? ` <span class="down">(attack &minus;${pen})</span>` : ''}`);
    }
  }
  return `<div class="iinfo">${what}${fits.length ? `<br>${fits.join('; ')}` : ''}${not.length ? `<br>Not for: ${not.join(', ')}` : ''}</div>`;
}
const fmt = n => n > 0 ? '+' + n : n < 0 ? String(n) : '';
function itemValue(it) { const b = ITEMS[it.base]; if (it.cursed) return 1; return b.kind === 'ring' ? b.cost : b.cost * (it.plus > 0 ? 1 + 4 * it.plus : 1); }
function sellPrice(it) { return it.id >= 2 ? Math.max(1, Math.floor(itemValue(it) / 2)) : Math.max(1, Math.floor(ITEMS[it.base].cost / 4)); }
function makeItem(depth) {
  const r = R(100);
  let base;
  if (r < 34) base = pick(WEAPONS);
  else if (r < 56) base = pick(ARMORS);
  else if (r < 80) base = depth >= 3 && R(3) === 0 ? 'potion_greater' : 'potion_heal';
  else if (r < 91) base = 'scroll_id';
  else base = 'ring_prot';
  const it = {base, plus: 0, cursed: false, id: 0};
  const k = ITEMS[base].kind;
  if (k === 'ring') { if (R(100) < 20) { it.plus = -1; it.cursed = true; } else it.plus = 1; }
  else if (k === 'weapon' || k === 'armor' || k === 'shield') {
    if (R(100) < 18 + depth * 6) it.plus = depth >= 3 && R(3) === 0 ? 2 : 1;
    else if (R(100) < 14) { it.plus = -1; it.cursed = true; }
  }
  return it;
}

/* ---------- map ---------- */
const lvl = d => LV[d - 1];
function tile(d, x, y) { const m = lvl(d).map; if (y < 0 || y >= m.length || x < 0 || x >= m[0].length) return '#'; return m[y][x]; }
const skey = (d, x, y) => d + ':' + x + ',' + y;
function passable(d, x, y) { const t = tile(d, x, y); if (t === '#') return false; if (t === 'S') return !!S.secrets[skey(d, x, y)]; return true; }
function find(d, ch) { const m = lvl(d).map; for (let y = 0; y < m.length; y++) { const x = m[y].indexOf(ch); if (x >= 0) return {x, y}; } return null; }
function markSeen() { const {depth, x, y} = S.pos; (S.seen[depth] ||= {})[x + ',' + y] = 1; }

/* ---------- rooms ----------
   A room is a patch of floor bounded by rock and doors. Each room holds at most
   one encounter: it is decided the first time the party walks in, and a beaten
   room stays empty until the party goes back to town. */
const ROOMS = LV.map(L => {
  const m = L.map, ids = m.map(r => [...r].map(() => -1)); let n = 0;
  for (let y = 0; y < m.length; y++) for (let x = 0; x < m[0].length; x++) {
    if ('#DS'.includes(m[y][x]) || ids[y][x] >= 0) continue;
    const q = [[x, y]]; ids[y][x] = n;
    while (q.length) { const [cx, cy] = q.pop(); for (let f = 0; f < 4; f++) { const nx = cx + DX[f], ny = cy + DY[f]; if (!'#DS'.includes(m[ny][nx]) && ids[ny][nx] < 0) { ids[ny][nx] = n; q.push([nx, ny]); } } }
    n++;
  }
  return {ids, n};
});
const roomAt = (d, x, y) => ROOMS[d - 1].ids[y]?.[x] ?? -1;
const roomKey = (d, x, y) => { const r = roomAt(d, x, y); return r < 0 ? null : d + ':' + r; };
function rollRoom(d, r, force) {
  const L = lvl(d);
  for (const [k, l] of Object.entries(L.lairs || {})) {
    const [x, y] = k.split(',').map(Number);
    if (roomAt(d, x, y) === r) return {held: true, mid: l.monster, n: l.count[0] + R(l.count[1] - l.count[0] + 1), lair: true};
  }
  if (force || R(100) < (L.room_chance ?? 50)) { const mid = weighted(L.wander), m = MON[mid]; return {held: true, mid, n: Math.min(d + 1, m.group[0] + R(m.group[1] - m.group[0] + 1))}; }
  return {held: false};
}
function quietRoom() { S.rooms ||= {}; const k = roomKey(S.pos.depth, S.pos.x, S.pos.y); S.pos.room = k; if (k && !S.rooms[k]) S.rooms[k] = {held: false}; }

/* ---------- town ---------- */
function newGame(ready) {
  S = fresh();
  if (ready) {
    const mk = (n, r, g, st) => makeChar(n, r, g, st, START_GEAR[g]);
    S.roster = [
      mk('Bran', 'dwarf', 'fighter', {str:16, dex:12, con:16, int:9, wis:12, cha:10}),
      mk('Wren', 'halfling', 'rogue', {str:10, dex:17, con:13, int:12, wis:11, cha:13}),
      mk('Ysolde', 'elf', 'wizard', {str:8, dex:15, con:12, int:17, wis:12, cha:11}),
      mk('Tamsin', 'human', 'cleric', {str:13, dex:11, con:14, int:11, wis:16, cha:12}),
    ];
    S.party = S.roster.map(c => c.id);
    S.gold = 60;
    say('Four companions wait at the edge of the town square. The way down is a stair cut between the roots.', 'note');
  } else {
    say('The guild ledgers are empty. Make your first character in the Roster.', 'note');
  }
  ui.screen = 'town'; ui.place = ready ? 'square' : 'roster'; ui.combat = ui.chest = null;
  save(); render();
}
function toTown() {
  S.inDungeon = false; S.pos = null; S.rooms = {};
  for (const id of S.carried) { const c = ch(id); if (c) { c.where = 'town'; if (S.party.length < 4 && !S.party.includes(id)) S.party.push(id); } }
  S.carried = [];
  for (const c of S.roster) { if (c.status === 'ok') { c.hp = c.mhp; c.sp = c.msp; } c.where = c.where === 'dungeon' ? 'dungeon' : 'town'; }
  say('You climb out into the grey light. The inn restores everyone still breathing.', 'good');
  ui.screen = 'town'; ui.place = 'square'; ui.map = false;
  save(); render();
}
function enterDungeon() {
  if (!alive().length) { ui.msg = 'Nobody in the party can walk. Raise or replace them first.'; return render(); }
  const dead = party().filter(c => c.status !== 'ok');
  if (dead.length) { S.party = S.party.filter(id => ch(id).status === 'ok'); say(`${dead.map(c => c.name).join(', ')} stay${dead.length > 1 ? '' : 's'} behind with the temple.`, 'muted'); }
  const st = find(1, '<');
  S.trip = (S.trip || 0) + 1; // a new trip: items can be studied again
  S.inDungeon = true; S.pos = {depth: 1, x: st.x, y: st.y, f: openFacing(1, st.x, st.y)};
  S.rooms = {}; quietRoom();
  say(`You descend into ${lvl(1).name}.`, 'note');
  ui.screen = 'dungeon'; markSeen(); save(); render();
}
function openFacing(d, x, y) { for (let f = 0; f < 4; f++) if (passable(d, x + DX[f], y + DY[f])) return f; return 0; }

/* ---------- movement ---------- */
function step(back) {
  if (ui.combat || ui.chest) return;
  const f = back ? (S.pos.f + 2) % 4 : S.pos.f;
  const nx = S.pos.x + DX[f], ny = S.pos.y + DY[f];
  if (!passable(S.pos.depth, nx, ny)) { say(tile(S.pos.depth, nx, ny) === 'D' ? 'The door will not budge.' : 'Wet rock. No way through.'); return render(); }
  S.pos.prev = {x: S.pos.x, y: S.pos.y};
  S.pos.x = nx; S.pos.y = ny;
  arrive();
}
function turn(t) { if (ui.combat || ui.chest) return; S.pos.f = (S.pos.f + t + 4) % 4; render(); }
function arrive() {
  markSeen();
  const {depth: d, x, y} = S.pos, t = tile(d, x, y), k = x + ',' + y, L = lvl(d);
  pickUpBodies();
  if (t === 'N') say(L.notes[k], 'note');
  if (t === 'F') say('Clear water wells up through the moss here.', 'note');
  if (t === '>') say('A root-tangled stair leads down.', 'note');
  if (t === '<') say(d === 1 ? 'Daylight, faintly, up the stair.' : 'A stair climbs back up.', 'note');
  const rk = roomKey(d, x, y), entered = rk && rk !== S.pos.room;
  S.pos.room = rk;
  if (entered) {
    S.rooms ||= {};
    const rec = S.rooms[rk] ||= rollRoom(d, roomAt(d, x, y));
    if (rec.held) return startFight(rec.mid, rec.n, rk);
  }
  save(); render();
}

/* ---------- the fallen ----------
   Each living member can carry one body. Bodies past that are set down where
   the party stands, and can be picked up again by walking onto the square. */
const capacity = () => alive().length;
function pickUpBodies() {
  const {depth: d, x, y} = S.pos;
  for (const f of S.fallen.filter(f => f.depth === d && f.x === x && f.y === y)) {
    const room = capacity() - S.carried.length;
    if (room <= 0) { say(`The fallen lie here: ${f.ids.map(id => ch(id)?.name).join(', ')}. Nobody has a free pair of hands.`, 'muted'); continue; }
    const take = f.ids.slice(0, room), rest = f.ids.slice(room);
    S.carried.push(...take); S.gold += f.gold; f.gold = 0;
    if (rest.length) f.ids = rest; else S.fallen = S.fallen.filter(g => g !== f);
    say(`You take up ${take.map(id => ch(id)?.name).join(', ')}${rest.length ? `. ${rest.map(id => ch(id)?.name).join(', ')} must wait` : ''}.`, 'good');
  }
}
function leaveBody(id, quiet) {
  const {depth, x, y} = S.pos;
  S.carried = S.carried.filter(i => i !== id);
  const f = S.fallen.find(f => f.depth === depth && f.x === x && f.y === y);
  if (f) f.ids.push(id); else S.fallen.push({ids: [id], depth, x, y, gold: 0});
  const c = ch(id); c.where = 'dungeon';
  if (!quiet) say(`You set ${c.name}'s body down. It will be here when you come back.`, 'muted');
}
function settleBodies() {
  for (const c of party()) if (c.status !== 'ok') {
    S.party = S.party.filter(i => i !== c.id); S.carried.push(c.id); c.para = 0;
    say(`The party takes up ${c.name}'s body.`, 'muted');
  }
  while (S.carried.length > capacity() && alive().length) {
    const id = S.carried[S.carried.length - 1]; leaveBody(id, true);
    say(`Too many to carry. ${ch(id).name}'s body is left here, to fetch later.`, 'foe');
  }
}
function useStairs() {
  const {depth: d, x, y} = S.pos, t = tile(d, x, y);
  if (t === '<') {
    if (d === 1) return toTown();
    S.pos = {depth: d - 1, x, y, f: S.pos.f}; quietRoom();
    say(`You climb to ${lvl(d - 1).name}.`, 'note');
  } else if (t === '>') {
    if (!lvl(d + 1)) { say('Roots choke the stair below. The deeper levels are not open yet.', 'note'); return render(); }
    S.pos = {depth: d + 1, x, y, f: S.pos.f}; quietRoom();
    say(`You descend to ${lvl(d + 1).name}.`, 'note');
  }
  markSeen(); save(); render();
}
function drink() {
  for (const c of alive()) { c.hp = Math.min(c.mhp, c.hp + roll('1d8') + 2); c.sp = Math.min(c.msp, c.sp + 2); }
  say('The water is cold and tastes of stone. Everyone feels steadier.', 'good');
  save(); render();
}
function searchChance() { const p = best('perception'); return pct(30 + (p ? rank(p, 'perception') * 12 : 0) + Math.max(...alive().map(c => mod(c.st.wis))) * 5); }
function search() {
  const {depth: d, x, y} = S.pos;
  const rogue = best('perception');
  const chance = searchChance();
  let found = 0, any = false;
  for (let f = 0; f < 4; f++) {
    const nx = x + DX[f], ny = y + DY[f];
    if (tile(d, nx, ny) === 'S' && !S.secrets[skey(d, nx, ny)]) { any = true; if (R(100) < chance) { S.secrets[skey(d, nx, ny)] = 1; found++; } }
  }
  say(found ? `${rogue ? rogue.name : 'Someone'} finds a hidden door in the stonework!` : 'You run your hands along the wet stone and find nothing.', found ? 'good' : '');
  void any; save(); render();
}

/* ---------- combat ---------- */
function startFight(mid, n, room) {
  const m = MON[mid], lair = room && S.rooms[room]?.lair;
  const mons = Array.from({length: n}, () => { const hp = roll(m.hp); return {hp, mhp: hp, asleep: false, gone: false}; });
  ui.combat = {mid, mons, lair, room, round: 1, cur: 0, queue: [], target: 0, bless: false, xp: 0, killed: 0, first: true};
  S.aid = false;
  say(`${n > 1 ? n + ' ' + m.plural : 'A ' + m.name} ${lair ? (n > 1 ? 'guard' : 'guards') + ' this hollow' : (n > 1 ? 'wait' : 'waits') + ' in the dark here'}!`, 'foe');
  nextChooser(0); save(); render();
}
function choosers() { return party().filter(c => c.status === 'ok' && !c.para); }
function nextChooser(i) { ui.combat.cur = i; if (i >= choosers().length) resolveRound(); }
function liveFoes() { return ui.combat.mons.map((m, i) => ({m, i})).filter(o => !o.m.gone); }
function choose(a) {
  const C = ui.combat, c = choosers()[C.cur];
  if (a.act === 'run') { return flee(); }
  C.queue.push({id: c.id, ...a});
  ui.pick = null;
  nextChooser(C.cur + 1); render();
}
function undo() { const C = ui.combat; if (C.cur > 0) { C.queue.pop(); C.cur--; ui.pick = null; render(); } }
function flee() {
  const C = ui.combat, m = MON[C.mid];
  const best = Math.max(...alive().map(c => mod(c.st.dex)));
  if (C.lair && R(100) < 30) { say('The way back is blocked!', 'foe'); }
  else if (R(100) < 55 + best * 8) {
    say('You flee back the way you came.', 'good');
    if (C.room && S.rooms[C.room]) S.rooms[C.room].n = liveFoes().length;
    ui.combat = null;
    if (S.pos.prev) { S.pos.x = S.pos.prev.x; S.pos.y = S.pos.prev.y; S.pos.room = roomKey(S.pos.depth, S.pos.x, S.pos.y); }
    settleBodies(); save(); return render();
  } else say(`The ${m.plural.toLowerCase()} cut off your escape!`, 'foe');
  C.queue = []; monstersAct(); endRound();
}
function hitFoe(i, dmg, who) {
  const C = ui.combat, f = C.mons[i], m = MON[C.mid];
  f.hp -= dmg; f.asleep = false;
  if (f.hp <= 0) { f.gone = true; C.xp += m.xp; C.killed++; say(`${who} kills a ${m.name.toLowerCase()}.`, 'good'); }
}
function targetFor(i) { const live = liveFoes(); if (!live.length) return -1; return live.some(o => o.i === i) ? i : live[0].i; }
function partyActs() {
  const C = ui.combat, m = MON[C.mid];
  for (const q of C.queue) {
    const c = ch(q.id);
    if (!c || c.status !== 'ok') continue;
    if (!liveFoes().length) break;
    c.def = false;
    if (q.act === 'fight') {
      const swings = c.guild === 'fighter' && c.lvl >= 5 ? 2 : 1;
      for (let s = 0; s < swings; s++) {
        const t = targetFor(q.t); if (t < 0) break;
        const w = weaponOf(c), r = d20(), crit = r === 20;
        const total = r + prof(c) + atkMod(c) + (w ? w.it.plus : 0) + (C.bless ? roll('1d4') : 0) - armorPenalty(c);
        const foe = C.mons[t];
        if (r !== 1 && (crit || foe.asleep || total >= m.ac)) {
          let dmg = (w ? roll(w.b.dmg, crit) : 1) + atkMod(c) + (w ? w.it.plus : 0);
          if (c.guild === 'rogue' && C.first) dmg += roll(Math.ceil(c.lvl / 2) + 'd6', crit);
          dmg = Math.max(1, dmg);
          say(`${c.name} ${crit ? 'lands a crushing blow on' : 'hits'} a ${m.name.toLowerCase()} for ${dmg}.`);
          hitFoe(t, dmg, c.name);
        } else say(`${c.name} misses.`, 'muted');
      }
    } else if (q.act === 'defend') { c.def = true; say(`${c.name} raises a guard.`, 'muted'); }
    else if (q.act === 'item') {
      const it = c.inv[q.idx];
      if (it && ITEMS[it.base].kind === 'potion') quaff(c, q.idx, ch(q.on) || c);
    } else if (q.act === 'cast') {
      const sp = SPELLS[q.spell];
      if (c.sp < sp.sp) { say(`${c.name} has too little spell power.`, 'muted'); continue; }

      face([P(lx - .5, d, -.5), P(lx + .5, d, -.5), P(lx + .5, d, .5), P(lx - .5, d, .5)], d, {...c, dir: (f + 2) % 4}, false);
    }

function drawFoes(g, W, H) {
  const C = ui.combat, m = MON[C.mid], n = C.mons.length;
  const col = m.undead ? '#bfe3ff' : (C.mid.includes('fungus') ? '#d6a3ff' : '#ffb347');
  C.mons.forEach((f, i) => {
    if (f.gone) return;
    const x = W * (i + 1) / (n + 1) + (i % 2 ? 6 : -6), y = H * (.42 + (i % 3) * .07), s = Math.max(4, 16 - n);
    g.fillStyle = 'rgba(0,0,0,.6)'; g.beginPath(); g.ellipse(x, y + s * 2.4, s * 3.4, s * 4, 0, 0, 7); g.fill();

    g.shadowColor = col; g.shadowBlur = s * 1.6; g.fillStyle = col;
    for (const ex of [-1, 1]) { g.beginPath(); g.ellipse(x + ex * s, y, s * .55, s * .35, 0, 0, 7); g.fill(); }

  });
}
function drawMap(cv) {
  const g = cv.getContext('2d'), {depth: D, x: px, y: py, f} = S.pos, m = lvl(D).map, n = m.length, s = cv.width / n;
  g.fillStyle = '#0b0f0c'; g.fillRect(0, 0, cv.width, cv.height);
  const seen = S.seen[D] || {};
  for (const k in seen) {
    const [x, y] = k.split(',').map(Number);
    g.fillStyle = '#2b3626'; g.fillRect(x * s, y * s, s, s);
    for (let dd = 0; dd < 4; dd++) { const nx = x + DX[dd], ny = y + DY[dd]; if (!passable(D, nx, ny)) { g.fillStyle = tile(D, nx, ny) === 'D' ? '#7a5a34' : '#56634a'; g.fillRect(nx * s + 1, ny * s + 1, s - 2, s - 2); } }
    const t = tile(D, x, y), mark = {'<': '#c7d38f', '>': '#e2b45a', 'F': '#6cc5b3', 'N': '#9ba18b', 'L': '#cf5a42', 'D': '#7a5a34'}[t];
    if (mark) { g.fillStyle = mark; g.fillRect(x * s + s * .3, y * s + s * .3, s * .4, s * .4); }
  }
  const cxp = px * s + s / 2, cyp = py * s + s / 2;
  g.fillStyle = '#ffffff'; g.beginPath();
  g.moveTo(cxp + DX[f] * s * .4, cyp + DY[f] * s * .4);
  g.lineTo(cxp + DX[(f + 1) % 4] * s * .3 - DX[f] * s * .3, cyp + DY[(f + 1) % 4] * s * .3 - DY[f] * s * .3);
  g.lineTo(cxp - DX[(f + 1) % 4] * s * .3 - DX[f] * s * .3, cyp - DY[(f + 1) % 4] * s * .3 - DY[f] * s * .3);
  g.closePath(); g.fill();
}

    <button class="link" data-a="sell" data-i="${i}" ${it.eq ? 'disabled' : ''}>Sell</button> <button class="link" data-a="ident" data-i="${i}" ${it.id >= 2 || S.gold < 25 ? 'disabled' : ''}>Identify (25)</button></td></tr>`).join('');

    <h3>Sell or identify</h3>${sell ? `<div class="tablewrap"><table class="list">${sell}</table></div>` : '<p class="muted small">Nothing carried.</p>'}
    <p class="small muted">Unknown goods sell for a quarter of their base price.</p>
    <h3>Buy</h3><div class="tablewrap"><table class="list">${buy}</table></div></div>`;
}
/* Raising and rescue. Below level 5 the temple's rite is cheap and certain, and
   rescue is free, so a new party is never stranded. From level 5 the old costs
   and the chance of failure apply. */
const NOVICE = 5;
const raiseCost = c => c.lvl < NOVICE ? 5 * c.lvl : 60 * c.lvl;
const rescueCost = f => f.ids.reduce((t, id) => t + ((ch(id)?.lvl || 1) < NOVICE ? 0 : 40 * f.depth), 0);
const canPay = n => S.gold + S.bank >= n;
function pay(n) { const a = Math.min(S.gold, n); S.gold -= a; S.bank -= n - a; }
function raiseOne(c) {
  const cost = raiseCost(c), novice = c.lvl < NOVICE;
  if (!canPay(cost) && !novice) return false;
  if (canPay(cost)) pay(cost); else say(`The priests waive the fee for ${c.name}.`, 'muted');
  if (novice || R(100) < 70 + mod(c.st.con) * 5) { c.status = 'ok'; c.hp = c.mhp; c.sp = c.msp; say(`${c.name} draws a ragged breath and lives.`, 'good'); }
  else if (S.settings.lasting) { c.status = 'lost'; S.party = S.party.filter(x => x !== c.id); say(`The rite fails. ${c.name}'s body crumbles to ash.`, 'foe'); }
  else say(`The rite fails. ${c.name} does not stir.`, 'foe');
  return true;
}
function rescueOne(i) {
  const f = S.fallen[i], cost = rescueCost(f), own = Math.min(f.gold, cost);
  if (!canPay(cost - own)) return false;
  pay(cost - own); S.gold += f.gold - own;
  S.fallen.splice(i, 1);
  for (const id of f.ids) { const c = ch(id); if (c) c.where = 'town'; }
  say(`Rescuers bring home ${f.ids.map(id => ch(id)?.name).join(', ')}${cost ? ` for ${cost} gold` : ''}. The temple can raise them.`, 'good');
  return true;
}
function templeHTML() {
  const dead = S.roster.filter(c => c.status === 'dead' && c.where === 'town');
  const total = dead.reduce((t, c) => t + raiseCost(c), 0);
  const cursed = townFolk().filter(c => c.inv.some(it => it.eq && it.cursed && it.id >= 2));
  const rows = dead.map(c => { const cost = raiseCost(c); return `<tr><td>${esc(c.name)}</td><td class="small muted">${GUILDS[c.guild].name} ${c.lvl}</td><td class="n"><button class="link" data-a="raise" data-id="${c.id}" ${canPay(cost) || c.lvl < NOVICE ? '' : 'disabled'}>Raise (${cost} gold)</button></td></tr>`; }).join('');
  const crows = cursed.flatMap(c => c.inv.map((it, i) => it.eq && it.cursed && it.id >= 2 ? `<tr><td>${esc(c.name)}: ${esc(itemName(it))}</td><td class="n"><button class="link" data-a="uncurse" data-id="${c.id}" data-i="${i}" ${S.gold >= 30 ? '' : 'disabled'}>Break it (30 gold)</button></td></tr>` : '')).join('');
  return `<div class="panel"><h2>Temple</h2>
    <p class="small muted">Below level ${NOVICE} a raising costs 5 gold a level and always works; the priests waive the fee if you cannot pay. From level ${NOVICE} it costs 60 gold a level and can fail${S.settings.lasting ? ', and with Lasting death on a failure turns the body to ash' : '. The gold is spent, and you may try again'}.</p>
    <h3>The dead</h3>${rows ? `<div class="tablewrap"><table class="list">${rows}</table></div>${dead.length > 1 ? `<div class="btns"><button class="btn go" data-a="raiseall">Raise everyone (${total} gold)</button></div>` : ''}` : '<p class="muted small">No bodies in the temple. The fallen must be brought home first.</p>'}
    <h3>Curses</h3>${crows ? `<div class="tablewrap"><table class="list">${crows}</table></div>` : '<p class="muted small">No known curses. A cursed item shows itself when someone tries to take it off.</p>'}</div>`;
}
function morgueHTML() {
  const rows = S.fallen.map((f, i) => { const cost = rescueCost(f); return `<tr><td>${f.ids.map(id => esc(ch(id)?.name || '?')).join(', ')}</td><td class="small muted">depth ${f.depth}, square ${f.x}, ${f.y}</td>
    <td class="n"><button class="link" data-a="rescue" data-i="${i}" ${canPay(Math.max(0, cost - f.gold)) ? '' : 'disabled'}>${cost ? `Hire rescuers (${cost} gold)` : 'Bring them home (free)'}</button></td></tr>`; }).join('');
  return `<div class="panel"><h2>Morgue</h2><p class="small muted">Rescue is free for anyone below level ${NOVICE}. Above that, rescuers cost 40 gold a body per depth, paid from the gold the fallen carried, then the purse, then the bank. Or go down and find the bodies yourself: walking onto their square brings them home with you, with whatever gold they carried.</p>
    ${rows ? `<div class="tablewrap"><table class="list">${rows}</table></div>${S.fallen.length > 1 ? '<div class="btns"><button class="btn go" data-a="rescueall">Bring everyone home</button></div>' : ''}` : '<p class="muted">No one lies in the dungeon.</p>'}</div>`;
}
function bankHTML() {
  return `<div class="panel"><h2>Bank</h2><p>Purse: <b style="color:var(--lamp)">${S.gold}</b> gold. In the bank: <b style="color:var(--lamp)">${S.bank}</b> gold.</p>
    <p class="small muted">Gold in the bank stays in town. Gold in the purse goes where the party goes, and lies with them if they fall.</p>
    <div class="btns"><button class="btn" data-a="dep" ${S.gold ? '' : 'disabled'}>Deposit all</button><button class="btn" data-a="wd" data-n="50" ${S.bank ? '' : 'disabled'}>Withdraw 50</button><button class="btn" data-a="wd" data-n="all" ${S.bank ? '' : 'disabled'}>Withdraw all</button></div></div>`;
}

/* ---------- modal: character sheet and settings ---------- */
function modalHTML() {
  if (ui.modal === 'settings') return `<div class="modal" data-a="close" data-self="1"><div class="panel"><h2>Settings</h2>
    <label class="small" style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="set-lasting" ${S.settings.lasting ? 'checked' : ''}> Lasting death: a failed raising destroys the character</label>
    <h3>Save</h3><p class="small muted">The game saves itself in this browser after every move. To move it to another device, copy this code there.</p>
    <textarea id="savecode" rows="3" style="width:100%" readonly>${esc(btoa(unescape(encodeURIComponent(JSON.stringify(S)))))}</textarea>
    <div class="btns"><button class="btn" data-a="copysave">Copy save code</button><button class="btn" data-a="loadcode">Load a code</button></div>
    ${ui.loadcode ? `<textarea id="incode" rows="3" style="width:100%" placeholder="Paste a save code"></textarea><div class="btns"><button class="btn go" data-a="loadgo">Load it</button></div>` : ''}
    <h3>Start over</h3><div class="btns"><button class="btn warn" data-a="title">Back to the title</button><button class="btn" data-a="close">Close</button></div>${fine()}</div></div>`;
  if (ui.modal !== 'sheet') return '';
  const c = ch(ui.sheet.id); if (!c) return '';
  const g = GUILDS[c.guild], town = ui.screen === 'town', fighting = !!ui.combat;
  const others = (town ? townFolk() : party()).filter(o => o.id !== c.id && o.status === 'ok');
  const pickId = ui.sheet.idPick;
  const items = c.inv.map((it, i) => {
    const b = ITEMS[it.base], acts = [];
    if (pickId != null && pickId !== i) return `<tr><td>${esc(itemName(it))}</td><td class="n"><button class="link" data-a="idthis" data-i="${i}" ${it.id >= 2 ? 'disabled' : ''}>Identify this</button></td></tr>`;
    if (!fighting && c.status === 'ok') {
      if (['weapon','armor','shield','ring'].includes(b.kind)) acts.push(`<button class="link" data-a="equip" data-i="${i}">${it.eq ? 'Take off' : 'Wear'}</button>`);
      if (b.kind === 'potion') acts.push(`<button class="link" data-a="drinkpot" data-i="${i}">Drink</button>`);
      if (b.kind === 'scroll') acts.push(`<button class="link" data-a="readid" data-i="${i}">Read</button>`);
      if (rank(c, 'lore') && it.id < 2) acts.push(`<button class="link" data-a="study" data-i="${i}">Study</button>`);
      if (!it.eq) { for (const o of others.slice(0, 3)) acts.push(`<button class="link" data-a="give" data-i="${i}" data-to="${o.id}" ${o.inv.length >= 10 ? 'disabled' : ''}>To ${esc(o.name)}</button>`); acts.push(`<button class="link" data-a="drop" data-i="${i}">Drop</button>`); }
    }
    return `<tr><td>${esc(itemName(it))}${it.eq ? ' <span class="small muted">(worn)</span>' : ''}${itemInfo(c, it)}</td><td class="n" style="white-space:normal">${acts.join(' ')}</td></tr>`;
  }).join('');
  const w = weaponOf(c);
  const spells = spellsOf(c);
  return `<div class="modal" data-a="close" data-self="1"><div class="panel"><h2>${esc(c.name)}</h2>
    <p class="muted">${RACES[c.race].name} ${g.name}, level ${c.lvl}. ${c.xp} of ${XP_NEXT[c.lvl]} xp to the next level.${c.status !== 'ok' ? ' <b style="color:var(--blood)">' + (c.status === 'lost' ? 'Lost.' : 'Dead.') + '</b>' : ''}</p>
    <div class="stats">${STATS.map(k => `<div><small>${k.toUpperCase()}</small>${c.st[k]}</div>`).join('')}</div>
    <p class="small">Armor class <b>${acOf(c)}</b>. Attack ${fmt(prof(c) + atkMod(c) + (w ? w.it.plus : 0) - armorPenalty(c)) || '+0'}${armorPenalty(c) ? ` <span class="down">(armor too heavy: &minus;${armorPenalty(c)})</span>` : ''} with ${w ? esc(itemName(w.it).toLowerCase()) : 'bare hands'}${w ? ' (' + w.b.dmg + ')' : ''}. Hits ${c.hp} / ${c.mhp}${c.msp ? `, spell points ${c.sp} / ${c.msp}` : ''}.</p>
    <p class="small">Skills: ${Object.entries(SKILLS).filter(([k]) => rank(c, k)).map(([k, s]) => `${s.name} ${rank(c, k)}`).join(', ') || 'none yet'}.${c.tp ? ` <span style="color:var(--lamp)">${c.tp} training point${c.tp === 1 ? '' : 's'} to spend at the guild.</span>` : ''}</p>
    ${spells.length ? `<p class="small">Spells: ${spells.map(([k, s]) => `${s.name} <span class="muted">(${s.sp} SP, ${s.about})</span>${s.field && !fighting && c.status === 'ok' ? ` <button class="link" data-a="fieldcast" data-s="${k}" ${c.sp >= s.sp ? '' : 'disabled'}>Cast</button>` : ''}`).join('; ')}</p>` : ''}
    <h3>Pack (${c.inv.length} / 10)</h3>${pickId != null ? '<p class="small" style="color:var(--lamp)">Choose an item for the scroll to reveal.</p>' : ''}
    ${items ? `<div class="tablewrap"><table class="list">${items}</table></div>` : '<p class="muted small">Empty.</p>'}
    <div class="btns" style="margin-top:10px"><button class="btn" data-a="close">Close</button></div></div></div>`;
}

/* ---------- actions ---------- */
const A = {
  continue() { S = loadSave(); if (!S) return; S.roster.forEach(ensureSkills); ui.screen = S.inDungeon ? 'dungeon' : 'town'; ui.place = 'square'; render(); },
  new(d) { if (loadSave() && !d.sure && ui.screen === 'title') { ui.confirm = 'new'; ui.ready = d.ready; return render(); } ui.confirm = null; newGame(!!d.ready); },
  cancel() { ui.confirm = null; render(); },
  title() { ui.modal = null; ui.screen = 'title'; render(); },
  settings() { ui.modal = 'settings'; ui.loadcode = false; render(); },
  close(d, e) { if (d.self && e.target !== e.currentTarget && !e.target.matches('[data-self]')) return; ui.modal = null; ui.sheet = null; render(); },
  copysave() { const t = $('#savecode'); navigator.clipboard?.writeText(t.value).then(() => { ui.msg = 'Save code copied.'; }, () => { t.select(); }); },
  loadcode() { ui.loadcode = true; render(); },
  loadgo() { try { const s = JSON.parse(decodeURIComponent(escape(atob($('#incode').value.trim())))); if (!s.roster) throw 0; S = s; S.roster.forEach(ensureSkills); ui.modal = null; ui.screen = S.inDungeon ? 'dungeon' : 'town'; save(); render(); } catch (e) { ui.msg = 'That code did not load. Check that the whole code was pasted.'; ui.modal = null; render(); } },
  place(d) { ui.place = d.p; ui.msg = ''; render(); },
  enter() { enterDungeon(); },
  step(d) { step(!!d.back); },
  turn(d) { turn(+d.t); },
  search() { search(); },
  map() { ui.map = !ui.map; render(); },
  stairs() { useStairs(); },
  drink() { drink(); },
  sheet(d) { ui.modal = 'sheet'; ui.sheet = {id: d.id}; render(); },
  sel(d) { ui.sel = d.id; render(); },
  order() { ui.order = !ui.order; render(); },
  up(d) { const i = S.party.indexOf(d.id); if (i > 0) { [S.party[i - 1], S.party[i]] = [S.party[i], S.party[i - 1]]; save(); } render(); },
  setdown(d) { if (ui.combat || ui.chest || !S.carried.includes(d.id)) return; leaveBody(d.id); save(); render(); },
  target(d) { ui.combat.target = +d.i; render(); },
  fight() { choose({act: 'fight', t: ui.combat.target}); },
  defend() { choose({act: 'defend'}); },
  run() { choose({act: 'run'}); },
  undo() { undo(); },
  pick(d) { ui.pick = d.p || null; render(); },
  cast(d) { choose({act: 'cast', spell: d.s, t: ui.combat.target}); },
  usepot(d) { choose({act: 'item', idx: +d.i}); },
  chest(d) { chestAct(d.c); },
  newc() { ui.newc = {name: '', race: 'human', guild: 'fighter', base: {...PB_PRESET.fighter}}; render(); },
  preset() { grabForm(); ui.newc.base = {...PB_PRESET[ui.newc.guild]}; render(); },
  pb(d) { grabForm(); const N = ui.newc, v = N.base[d.k] + +d.d; if (v < 8 || v > 15) return; const nb = {...N.base, [d.k]: v}; if (pbSpent(nb) > PB_POINTS) return; N.base = nb; render(); },
  cancelc() { ui.newc = null; render(); },
  makec() {
    grabForm(); const N = ui.newc;
    const name = N.name.trim() || pick(['Ash', 'Brin', 'Corra', 'Dell', 'Fen', 'Hollis', 'Ivo', 'Moss', 'Rook', 'Sorrel']);
    const st = withRace(N.base, N.race); if (st[GUILDS[N.guild].req] < 11 || pbSpent(N.base) > PB_POINTS) return;
    const c = makeChar(name, N.race, N.guild, st, START_GEAR[N.guild]);
    S.roster.push(c); if (S.party.length < 4) S.party.push(c.id);
    S.gold += 15; ui.newc = null; say(`${name} joins the ${GUILDS[N.guild].name.toLowerCase()}s' guild${S.party.includes(c.id) ? ' and the party' : ''}.`, 'good'); save(); render();
  },
  party(d) { if (S.party.length < 4) S.party.push(d.id); save(); render(); },
  unparty(d) { S.party = S.party.filter(x => x !== d.id); save(); render(); },
  del(d) { S.roster = S.roster.filter(c => c.id !== d.id); save(); render(); },
  advance(d) {
    const c = ch(d.id), fee = 30 * c.lvl; if (c.xp < XP_NEXT[c.lvl] || S.gold < fee) return;
    S.gold -= fee; c.lvl++; c.told = 0;
    const gain = Math.max(1, Math.floor(GUILDS[c.guild].hd / 2) + 1 + mod(c.st.con));
    c.mhp += gain; c.hp = c.mhp; c.msp = maxSp(c); c.sp = c.msp;
    ensureSkills(c); c.tp += SK.points_per_level;
    const news = Object.values(SPELLS).filter(s => s.guild === c.guild && s.lvl === c.lvl).map(s => s.name);
    say(`${c.name} reaches level ${c.lvl}: ${gain} more hits, ${SK.points_per_level} training points${news.length ? ', and learns ' + news.join(', ') : ''}${c.guild === 'fighter' && c.lvl === 5 ? ', and a second attack' : ''}.`, 'good');
    ui.sel = c.id; save(); render();
  },
  train(d) {
    const c = ch(d.id), k = d.k; if (!c || !SKILLS[k]) return;
    ensureSkills(c);
    const cost = skillCost(c, k);
    if (c.tp < cost || rank(c, k) >= skillCap(c)) return;
    c.tp -= cost; c.sk[k] = rank(c, k) + 1;
    say(`${c.name} trains ${SKILLS[k].name} to ${c.sk[k]}.`, 'good');
    save(); render();
  },
  tend() { tend(); },
  buy(d) { const c = selChar(), b = ITEMS[d.k]; if (S.gold < b.cost || c.inv.length >= 10) return; S.gold -= b.cost; c.inv.push({base: d.k, plus: 0, cursed: false, id: 2}); say(`${c.name} buys ${b.name.toLowerCase()}.`); save(); render(); },
  sell(d) { const c = selChar(), it = c.inv[+d.i]; if (!it || it.eq) return; const p = sellPrice(it); S.gold += p; c.inv.splice(+d.i, 1); say(`${c.name} sells ${itemName(it).toLowerCase()} for ${p} gold.`, 'gold'); save(); render(); },
  ident(d) { const c = selChar(), it = c.inv[+d.i]; if (!it || S.gold < 25) return; S.gold -= 25; it.id = 2; S.known[it.base] = 1; say(`The shopkeeper squints at it: ${itemName(it)}.`, 'good'); save(); render(); },
  raise(d) { raiseOne(ch(d.id)); save(); render(); },
  raiseall() { for (const c of S.roster.filter(c => c.status === 'dead' && c.where === 'town')) if (!raiseOne(c)) { say('The purse runs dry before the last rite.', 'muted'); break; } save(); render(); },
  uncurse(d) { const c = ch(d.id); if (S.gold < 30) return; S.gold -= 30; const it = c.inv[+d.i]; c.inv.splice(+d.i, 1); say(`The priests break ${itemName(it).toLowerCase()}. It falls away in pieces.`, 'good'); save(); render(); },
  rescue(d) { rescueOne(+d.i); save(); render(); },
  rescueall() { for (let i = S.fallen.length - 1; i >= 0; i--) rescueOne(i); save(); render(); },
  dep() { S.bank += S.gold; S.gold = 0; save(); render(); },
  wd(d) { const n = d.n === 'all' ? S.bank : Math.min(50, S.bank); S.bank -= n; S.gold += n; save(); render(); },
  equip(d) { const c = ch(ui.sheet.id); equip(c, +d.i); save(); render(); },
  drinkpot(d) { const c = ch(ui.sheet.id); quaff(c, +d.i, c); save(); render(); },
  study(d) { const c = ch(ui.sheet.id); S.trip ||= 1; study(c, +d.i); save(); render(); },
  readid(d) {
    const c = ch(ui.sheet.id), it = c.inv[+d.i];
    if (it.base !== 'scroll_id') return;
    ui.sheet.scroll = +d.i; ui.sheet.idPick = +d.i; S.known.scroll_id = 1; it.id = 2; render();
  },
  idthis(d) {
    const c = ch(ui.sheet.id), s = ui.sheet.scroll, it = c.inv[+d.i];
    it.id = 2; if (['potion','scroll','ring'].includes(ITEMS[it.base].kind)) S.known[it.base] = 1;
    say(`${c.name} reads the scroll. It shows: ${itemName(it)}.`, 'good');
    c.inv.splice(s, 1); ui.sheet.idPick = null; save(); render();
  },
  give(d) { const c = ch(ui.sheet.id), o = ch(d.to), it = c.inv[+d.i]; if (!it || it.eq || o.inv.length >= 10) return; c.inv.splice(+d.i, 1); o.inv.push(it); save(); render(); },
  drop(d) { const c = ch(ui.sheet.id), it = c.inv[+d.i]; if (!it || it.eq) return; c.inv.splice(+d.i, 1); say(`${c.name} leaves ${itemName(it).toLowerCase()} behind.`, 'muted'); save(); render(); },
  fieldcast(d) {
    const c = ch(ui.sheet.id), s = SPELLS[d.s]; if (c.sp < s.sp) return;
    const t = (ui.screen === 'town' ? townFolk() : alive()).filter(x => x.status === 'ok').sort((a, b) => a.hp / a.mhp - b.hp / b.mhp)[0];
    c.sp -= s.sp; heal(t, roll('1d8') + mod(c.st.wis), c.name); save(); render();
  },
};
function grabForm() { const N = ui.newc; if (!N) return; const n = $('#nc-name'); if (n) N.name = n.value; const r = $('#nc-race'), g = $('#nc-guild'); if (r) N.race = r.value; if (g) N.guild = g.value; }

document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b) return;
  const f = A[b.dataset.a]; if (!f) return;
  if (b.dataset.a === 'close' && b.dataset.self && e.target !== b) return;
  f(b.dataset, e);
});
document.addEventListener('change', e => {
  if (e.target.id === 'nc-race') { grabForm(); render(); }
  if (e.target.id === 'nc-guild') { grabForm(); ui.newc.base = {...PB_PRESET[ui.newc.guild]}; render(); }
  if (e.target.id === 'set-lasting') { S.settings.lasting = e.target.checked; save(); }
});
document.addEventListener('keydown', e => {
  if (ui.screen !== 'dungeon' || ui.modal || e.target.matches('input, textarea, select')) return;
  const k = e.key.toLowerCase();
  const map = {arrowup: () => step(false), w: () => step(false), arrowdown: () => step(true), s: () => step(true), arrowleft: () => turn(-1), a: () => turn(-1), arrowright: () => turn(1), d: () => turn(1), f: () => !ui.combat && !ui.chest && search(), m: () => A.map(), enter: () => !ui.combat && !ui.chest && '<>'.includes(tile(S.pos.depth, S.pos.x, S.pos.y)) && useStairs()};
  if (map[k]) { e.preventDefault(); map[k](); }
});
if (LV.length) render(); else document.body.textContent = 'No levels were built into this page.';
</script>
